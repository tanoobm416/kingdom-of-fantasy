<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#151f22">
<meta name="description" content="Step through the golden gateway and follow an amber moth through the Kingdom of Fantasy.">
<title>Beyond the Page · Kingdom of Fantasy</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="world" aria-label="Kingdom of Fantasy interactive world">
  <div id="stage"></div>
  <section id="entrance" aria-labelledby="title">
    <div class="entrance-content">
      <span class="crest" aria-hidden="true">✧</span>
      <h1 id="title">The Kingdom<br><i>of Fantasy</i></h1>
      <button id="enter" type="button">ENTER THE KINGDOM</button>
      <p id="loading" role="status" hidden>Opening the gateway…</p>
    </div>
  </section>
  <button id="reset" type="button" aria-label="Reset camera" title="Reset camera" hidden>
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.6 7M4 5v6h6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <button id="sound" type="button" hidden></button>
  <button id="return" type="button" hidden>Return to the map</button>
  <button id="gate-action" type="button" hidden>Open the kingdom map</button>
  <header id="map-title" hidden><h2>Kingdom of Fantasy</h2></header>
  <div id="map-choices" role="group" aria-label="Kingdoms on the map" hidden></div>
  <button id="discover" type="button" hidden></button>
  <aside id="caption" aria-live="polite" hidden></aside>
  <p id="gesture" hidden>Drag to look around · Pinch to zoom</p>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
